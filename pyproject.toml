[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto_job_apply"
version = "0.1.0"
description = "Python package template"
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.9.0",
    "dynaconf>=3.2.12",
    "fastapi>=0.115.0",
    "filelock>=3.32.3",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
auto_job_apply = "auto_job_apply.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_job_apply"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
]
